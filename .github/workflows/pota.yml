# Daily Parks on the Air update: refreshes the WA data cache in content/pota/ (one request for the park
# list, then only parks with newly uploaded logs, normally a handful) and commits it, keeping a dated
# history in the repo, and starts a site build so new activity goes live. Daily because logs reach POTA
# days or weeks after an activation; the total load is about the same as weekly. The site build never
# calls POTA itself. POTA offers no official data API yet: keep this daily at most, and gentle.
name: Daily POTA update

on:
  schedule:
    - cron: '0 22 * * *'   # daily, 6 am Perth
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: pota
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/fetch-pota.mjs
      - name: Commit the updated data
        run: |
          git config user.name "vk6.net POTA update"
          git config user.email "automation@vk6.net"
          git add content/pota
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "POTA data: update $(date -u +%Y-%m-%d)"
          git push
          # A push made by this job doesn't start other workflows, so ask for a site build directly.
          gh workflow run build.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

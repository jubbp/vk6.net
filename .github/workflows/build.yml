# Builds vk6.net and publishes it to GitHub Pages.
# Runs on every push; daily just after midnight Perth (so "today", "this week" and the calendars roll
# over, and Drive and Sheet edits are picked up); twice more on Sundays for the new episode (11 am and
# 9 pm Perth, after each broadcast); on demand ("Run workflow" after an edit you want live now); and when
# Apps Script sends a "content-updated" event (not wired up yet; then the Sunday runs can go).
# POTA data is refreshed separately, weekly (pota.yml).
name: Build and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '10 16 * * *'   # daily, 00:10 Perth
    - cron: '0 3 * * 0'     # Sunday 11:00 Perth, after the morning broadcast
    - cron: '0 13 * * 0'    # Sunday 21:00 Perth, after the evening repeat
  workflow_dispatch:
  repository_dispatch:
    types: [content-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run fetch
      - run: npm run build
        env:
          # Served from /<repo>/ until the custom domain is set; '/' after.
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
